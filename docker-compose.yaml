x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
    target: airflow
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-local-airflow-development-key}
    PYTHONPATH: /opt/project
    HF_HOME: /opt/airflow/model-cache
    DATASET_DIR: /opt/airflow/dataset
    PIPELINE_WORK_DIR: /opt/airflow/pipeline
    RAG_INDEX_DIR: /opt/airflow/index
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-paraphrase-multilingual-MiniLM-L12-v2}
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./dataset:/opt/airflow/dataset:ro
    - airflow-logs:/opt/airflow/logs
    # Keep intermediate artifacts on the host for inspection and debugging.
    # Each run writes parsed.json, anonymized.json, chunks.json and report.json.
    - ./pipeline_work:/opt/airflow/pipeline
    - rag-index:/opt/airflow/index
    - airflow-model-cache:/opt/airflow/model-cache
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  airflow-init:
    <<: *airflow-common
    restart: "no"
    environment:
      <<: *airflow-env
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    command: ["python", "/opt/project/init_airflow.py"]
  airflow-webserver:
    <<: *airflow-common
    ports:
      - "127.0.0.1:9080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  airflow-scheduler:
    <<: *airflow-common
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$$HOSTNAME\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PYTHONPATH: /opt/project
      RAG_INDEX_DIR: /opt/rag/index
      HF_HOME: /opt/rag/model-cache
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-mistralai/mistral-small-3.2-24b-instruct}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434/api/generate}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - rag-index:/opt/rag/index:ro
      - api-model-cache:/opt/rag/model-cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
  rag-evaluation:
    profiles: [evaluation]
    build:
      context: .
      dockerfile: Dockerfile
      target: evaluation
    environment:
      PYTHONPATH: /opt/project
      HF_HOME: /opt/rag/model-cache
      RAG_INDEX_DIR: /opt/rag/index
      RAG_API_URL: http://fastapi:8000
      RAGAS_DO_NOT_TRACK: "true"
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
    volumes:
      - ./evaluation:/evaluation
      - rag-index:/opt/rag/index:ro
      - api-model-cache:/opt/rag/model-cache
    healthcheck:
      disable: true
    restart: "no"

volumes:
  postgres-data:
  airflow-logs:
  rag-index:
  airflow-model-cache:
  api-model-cache:
